<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Akeso Healthsearch Memory Game</title>
<style>
:root{--bg:#FFFFFF;--ink:#041E42;--card:#041E42;--face:#FFFFFF;--accent:#041E42;--ok:#041E42;--muted:#717171;--edge:#717171;--tint:rgba(113,113,113,.16);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#041E42;--ink:#FFFFFF;--card:#717171;--face:#041E42;--accent:#FFFFFF;--ok:#FFFFFF;--muted:#C9CDD3;--edge:#FFFFFF;--tint:rgba(255,255,255,.14)}}
:root[data-theme="dark"]{--bg:#041E42;--ink:#FFFFFF;--card:#717171;--face:#041E42;--accent:#FFFFFF;--ok:#FFFFFF;--muted:#C9CDD3;--edge:#FFFFFF;--tint:rgba(255,255,255,.14)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:560px;padding:20px 16px 28px}
.logo{display:block;width:100%;max-width:300px;height:auto;border-radius:12px;margin:0 auto 14px}
h1{font-size:1.6rem;margin:0 0 4px;letter-spacing:-.01em}
p.sub{margin:0 0 16px;color:var(--muted)}
.bar{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:var(--tint);border-radius:12px;padding:8px 12px}
.stat b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.track{height:8px;border-radius:4px;background:var(--tint);overflow:hidden;margin-bottom:14px}
.fill{height:100%;width:100%;background:var(--accent);transition:width 1s linear}
.fill.low{background:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{aspect-ratio:3/4;perspective:600px;border:0;background:none;padding:0;cursor:pointer}
.tile:focus-visible{outline:3px solid var(--muted);outline-offset:2px;border-radius:12px}
.in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.tile.up .in,.tile.done .in{transform:rotateY(180deg)}
.f,.b{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center}
.b{background:var(--card);color:#fff;font-size:2rem;font-weight:700;opacity:.95}
.f{background:var(--face);transform:rotateY(180deg);border:2px solid var(--edge);font-weight:700;font-size:clamp(.55rem,2.6vw,.8rem);padding:2px;word-break:break-word;color:var(--ink)}
.b img{width:88%;height:auto;display:block;border-radius:4px}
.f{flex-direction:column;gap:4px}
.f img{width:100%;flex:1;min-height:0;object-fit:contain;background:#fff;border-radius:8px}
.tile.done .f{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.tile.bad .f{border-color:var(--muted);background:var(--tint)}
.pop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#041E42;padding:20px;z-index:5}
.pop.show{display:flex}
.box{background:var(--bg);border:2px solid var(--edge);color:var(--ink);border-radius:18px;padding:26px 24px;max-width:360px;width:100%;text-align:center}
.box h2{margin:0 0 6px}
.big{font-size:3.4rem;font-weight:800;color:var(--ink);line-height:1.1}
.box ul{list-style:none;padding:0;margin:14px 0 18px;color:var(--muted)}
button.go{background:var(--accent);color:var(--bg);border:0;border-radius:12px;padding:12px 26px;font-size:1.05rem;font-weight:700;cursor:pointer}
button.go:focus-visible{outline:3px solid var(--muted);outline-offset:2px}
.ask{font-weight:700;margin:16px 0 18px}
.mute{background:var(--tint);color:var(--ink);border:0;border-radius:12px;padding:0 14px;font-size:1.3rem;cursor:pointer}
.mute:focus-visible{outline:3px solid var(--muted);outline-offset:2px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9;display:none}
html{touch-action:pan-x pan-y;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
.grid,.pop{touch-action:none}
.pop{overscroll-behavior:contain}
html.lock,html.lock body{overflow:hidden;height:100%}
.toast{height:22px;text-align:center;color:var(--ink);font-weight:700;margin-bottom:6px}
@media (prefers-reduced-motion:reduce){.in,.fill{transition:none}}
</style>
</head>

var WORDS=["TEAM WORK","CAREGIVER","DEMENTIA","SUPPORT","MEDICATIONS","HOMECARE","NURSES","DOCTORS"];
var LIMIT=30,time,score,streak,best,pairs,first,lock,timer,running;
var grid=document.getElementById("grid"),pop=document.getElementById("pop"),box=document.getElementById("box");
var tEl=document.getElementById("time"),sEl=document.getElementById("score"),fill=document.getElementById("fill"),toast=document.getElementById("toast");

var ctx=null,muted=false;
function ac(){if(!ctx){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ctx=new C()}if(ctx.state==="suspended")ctx.resume();return ctx}
function tone(f,d,type,vol,delay){
  if(muted)return;var c=ac();if(!c)return;
  var t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
  o.type=type||"sine";o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.15,t+.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.02);
}
function sFlip(){tone(520,.07,"triangle",.15)}
function sMatch(){tone(660,.14,"sine",.2);tone(880,.2,"sine",.2,.1)}
function sBad(){tone(190,.22,"sawtooth",.1,.05)}
function sTick(){tone(600,.12,"square",.07)}
function sGo(){tone(900,.3,"square",.08)}
function fanfare(){
  [[392,0],[523,.14],[659,.28],[784,.42],[659,.62],[784,.76],[1047,.92]].forEach(function(n){tone(n[0],.2,"triangle",.2,n[1])});
  [523,659,784,1047].forEach(function(f){tone(f,.9,"triangle",.14,1.2)});
  [1568,1976,2349].forEach(function(f,i){tone(f,.12,"sine",.06,1.3+i*.12)});
}
function sEnd(won){
  if(won){fanfare()}
  else{[440,349,294].forEach(function(f,i){tone(f,.3,"triangle",.18,i*.18)})}
}

var READY=box.innerHTML,IDLE_MS=30000,idleT=null,finished=false;
function showReady(){
  clearTimeout(idleT);finished=false;running=false;
  box.innerHTML=READY;
  document.getElementById("start").addEventListener("click",countdown);
  build();tEl.textContent=LIMIT;sEl.textContent=0;toast.textContent="";
  fill.style.width="100%";fill.classList.remove("low");
  document.getElementById("confetti").style.display="none";
  pop.classList.add("show");
}
function armIdle(){clearTimeout(idleT);idleT=setTimeout(showReady,IDLE_MS)}

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

var LOGO=document.querySelector(".logo").src;
function build(){
  grid.innerHTML="";
  shuffle(WORDS.concat(WORDS)).forEach(function(w){
    var b=document.createElement("button");
    b.className="tile";b.dataset.w=w;b.setAttribute("aria-label","Hidden tile");
    var file=IMG[w]||"";
    b.innerHTML='<div class="in"><div class="b"><img src="'+LOGO+'" alt=""></div><div class="f"><img src="'+file+'" alt="" onerror="this.remove()"><span>'+w+'</span></div></div>';
    b.addEventListener("click",function(){flip(b)});
    grid.appendChild(b);
  });
}

function begin(){
  time=LIMIT;score=0;streak=0;best=0;pairs=0;first=null;lock=false;running=true;
  sEl.textContent=0;tEl.textContent=time;toast.textContent="";
  fill.style.width="100%";fill.classList.remove("low");
  build();pop.classList.remove("show");
  clearInterval(timer);
  timer=setInterval(function(){
    time--;tEl.textContent=time;
    fill.style.width=(time/LIMIT*100)+"%";
    if(time<=10)fill.classList.add("low");
    if(time<=0)finish(false);
  },1000);
}

function flip(t){
  if(!running||lock||t.classList.contains("up")||t.classList.contains("done"))return;
  t.classList.add("up");sFlip();
  if(!first){first=t;return}
  var a=first,b=t;first=null;
  if(a.dataset.w===b.dataset.w){
    streak++;best=Math.max(best,streak);pairs++;
    var pts=100+50*(streak-1);score+=pts;sEl.textContent=score;
    a.classList.replace("up","done");b.classList.replace("up","done");
    toast.textContent="+"+pts+(streak>1?"  ("+streak+" in a row)":"");sMatch();
    if(pairs===8)setTimeout(function(){finish(true)},500);
  }else{
    streak=0;lock=true;toast.textContent="";sBad();
    a.classList.add("bad");b.classList.add("bad");
    setTimeout(function(){
      a.classList.remove("up","bad");b.classList.remove("up","bad");lock=false;
    },650);
  }
}

function confetti(){
  var calm=!!(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches);
  var cv=document.getElementById("confetti"),cx=cv.getContext("2d");
  cv.width=window.innerWidth;cv.height=window.innerHeight;cv.style.display="block";
  var cols=["#FFFFFF","#C9CDD3","#717171"],ps=[];
  var N=calm?60:150;for(var i=0;i<N;i++)ps.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*(calm?.2:.6),w:6+Math.random()*6,h:8+Math.random()*8,vx:(-1+Math.random()*2)*(calm?.6:1),vy:calm?1.5+Math.random()*1.5:2+Math.random()*3,r:Math.random()*6,vr:(-.2+Math.random()*.4)*(calm?.5:1),c:cols[i%3]});
  var t0=null;
  function f(ts){
    if(!t0)t0=ts;
    cx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});
    if(ts-t0<4500)requestAnimationFrame(f);else{cx.clearRect(0,0,cv.width,cv.height);cv.style.display="none"}
  }
  requestAnimationFrame(f);
}

function countdown(){
  var n=3;clearTimeout(idleT);finished=false;document.getElementById("confetti").style.display="none";
  build();tEl.textContent=LIMIT;sEl.textContent=0;toast.textContent="";
  fill.style.width="100%";fill.classList.remove("low");
  box.innerHTML='<p style="color:var(--muted);margin:0">Get ready</p><div class="big" id="cd" aria-live="assertive">3</div>';
  pop.classList.add("show");sTick();
  var c=setInterval(function(){
    n--;
    if(n>0){document.getElementById("cd").textContent=n;sTick()}
    else{clearInterval(c);sGo();begin()}
  },1000);
}

function finish(won){
  if(!running)return;
  running=false;clearInterval(timer);sEnd(won);
  var bonus=won?time*10:0;score+=bonus;sEl.textContent=score;
  box.innerHTML='<h2>'+(won?"Congratulations!!":"Time is up")+'</h2>'+(won?'<p style="color:var(--muted);margin:0 0 12px">You found all 8 pairs.</p>':'')+
    '<div>Your score</div><div class="big">'+score+'</div>'+
    '<ul><li>Pairs matched: '+pairs+' of 8</li><li>Longest streak: '+best+'</li>'+
    (won?'<li>Time bonus: +'+bonus+'</li>':'')+'</ul>'+
    '<button class="go" id="again">Play again</button>';
  pop.classList.add("show");if(won)confetti();
  document.getElementById("again").addEventListener("click",countdown);
  document.getElementById("again").focus();
  finished=true;armIdle();
}

document.getElementById("start").addEventListener("click",countdown);
document.addEventListener("gesturestart",function(e){e.preventDefault()});
document.addEventListener("touchmove",function(e){if(e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener("wheel",function(e){if(e.ctrlKey)e.preventDefault()},{passive:false});
document.addEventListener("contextmenu",function(e){e.preventDefault()});
document.addEventListener("pointerdown",function(){if(finished)armIdle()});
if(window.innerHeight>=1100||/[?&]kiosk/.test(location.search))document.documentElement.classList.add("lock");
var mb=document.getElementById("mute");
mb.addEventListener("click",function(){muted=!muted;mb.innerHTML=muted?"&#128263;":"&#128266;";mb.setAttribute("aria-label",muted?"Turn sound on":"Turn sound off")});
build();
</script>
